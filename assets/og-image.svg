<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#121216" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8DFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  
  <!-- Aurora Glow Blobs -->
  <circle cx="200" cy="150" r="220" fill="#4F8DFF" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="480" r="260" fill="#8B5CF6" opacity="0.15" filter="url(#glow)" />

  <!-- Glass Card Container -->
  <rect x="80" y="80" width="1040" height="470" rx="32" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Shimmering Logo Bolt -->
  <path d="M190 190 L155 250 L185 250 L175 300 L220 235 L190 235 Z" fill="url(#accent)" />

  <!-- Title & Tagline -->
  <text x="250" y="230" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="64" letter-spacing="-1.5">Promptless AI</text>
  <text x="250" y="285" fill="#4F8DFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="600" font-size="28" letter-spacing="-0.5">ZERO-CLICK INTENT-AWARE BROWSER INTELLIGENCE</text>
  
  <text x="250" y="370" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="26" opacity="0.8">AI that understands your intent before you ask.</text>
  <text x="250" y="415" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="400" font-size="22">Chrome Extension Manifest V3 • Next.js 16 SaaS • Supabase RLS • Gemini 2.5 Flash</text>

  <!-- Pill Badge -->
  <rect x="250" y="455" width="260" height="46" rx="23" fill="url(#accent)" fill-opacity="0.15" stroke="url(#accent)" stroke-width="1.5" />
  <text x="380" y="485" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="700" text-anchor="middle">v1.0.0 PRODUCTION READY</text>
</svg>
