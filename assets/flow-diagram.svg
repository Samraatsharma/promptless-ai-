  <text x="610" y="105" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="14" text-anchor="middle">3. 0-Click Cards</text>
  <text x="610" y="130" fill="#71717A" font-family="monospace" font-size="11" text-anchor="middle">Raycast Shortcuts (⌘1)</text>

