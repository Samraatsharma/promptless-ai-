  </defs>
  <rect width="1000" height="240" rx="16" fill="#09090B" />
  
  <!-- Step 1 -->
  <rect x="40" y="70" width="180" height="100" rx="12" fill="#121216" stroke="#4F8DFF" stroke-width="1.5" />
