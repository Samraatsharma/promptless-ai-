<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8DFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="1100" height="500" rx="20" fill="#09090B" />

  <!-- Title -->
  <text x="50" y="50" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5">PROMPTLESS AI — ZERO-CLICK SYSTEM ARCHITECTURE</text>
  <text x="50" y="72" fill="#71717A" font-family="monospace" font-size="12">Manifest V3 Side Panel • Next.js 16 API • Upstash Redis • Gemini 2.5 Flash • Supabase RLS</text>

  <!-- Node 1: Chrome Extension Side Panel -->
  <rect x="50" y="140" width="220" height="180" rx="16" fill="url(#cardGrad)" stroke="#4F8DFF" stroke-width="1.5" />
  <text x="160" y="180" fill="#4F8DFF" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Chrome Extension (MV3)</text>
  <text x="160" y="210" fill="#E4E4E7" font-family="sans-serif" font-size="13" text-anchor="middle">420px Docked Side Panel</text>
  <text x="160" y="235" fill="#A1A1AA" font-family="monospace" font-size="11" text-anchor="middle">content.ts (SPA Observers)</text>
  <text x="160" y="260" fill="#A1A1AA" font-family="monospace" font-size="11" text-anchor="middle">Zero-Click Action Cards</text>

  <!-- Arrow 1 -->
  <path d="M 270 230 L 340 230" stroke="url(#lineGrad)" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="305" y="220" fill="#71717A" font-family="monospace" font-size="10" text-anchor="middle">POST JSON</text>

  <!-- Node 2: Next.js 16 SaaS App -->
  <rect x="340" y="140" width="220" height="180" rx="16" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="450" y="180" fill="#8B5CF6" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Next.js 16 SaaS API</text>
  <text x="450" y="210" fill="#E4E4E7" font-family="sans-serif" font-size="13" text-anchor="middle">/api/ai/intent &amp; /action</text>
  <text x="450" y="235" fill="#A1A1AA" font-family="monospace" font-size="11" text-anchor="middle">Zod Schema Validation</text>
  <text x="450" y="260" fill="#A1A1AA" font-family="monospace" font-size="11" text-anchor="middle">Upstash Redis Rate Limit</text>

  <!-- Arrow 2 to Gemini -->
  <path d="M 560 190 L 630 150" stroke="url(#lineGrad)" stroke-width="2.5" />
  <!-- Arrow 3 to Supabase -->
  <path d="M 560 270 L 630 310" stroke="url(#lineGrad)" stroke-width="2.5" />

  <!-- Node 3: Google Gemini 2.5 Flash -->
  <rect x="630" y="80" width="230" height="130" rx="16" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" />
  <text x="745" y="120" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Google Gemini 2.5 Flash</text>
  <text x="745" y="145" fill="#E4E4E7" font-family="sans-serif" font-size="13" text-anchor="middle">Intent Classification (98%)</text>
  <text x="745" y="170" fill="#A1A1AA" font-family="monospace" font-size="11" text-anchor="middle">Exponential Backoff Retry</text>

  <!-- Node 4: Supabase PostgreSQL -->
  <rect x="630" y="250" width="230" height="140" rx="16" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" />
  <text x="745" y="290" fill="#F59E0B" font-family="sans-serif" font-weight="700" font-size="16" text-anchor="middle">Supabase PostgreSQL</text>
  <text x="745" y="315" fill="#E4E4E7" font-family="sans-serif" font-size="13" text-anchor="middle">RLS Auth &amp; Cookie SSR</text>
  <text x="745" y="340" fill="#A1A1AA" font-family="monospace" font-size="11" text-anchor="middle">B-tree Index Optimization</text>

  <!-- Node 5: Output Screen -->
  <rect x="910" y="165" width="150" height="130" rx="16" fill="url(#cardGrad)" stroke="#4F8DFF" stroke-width="1.5" />
  <text x="985" y="210" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="15" text-anchor="middle">Markdown .MD</text>
  <text x="985" y="235" fill="#4F8DFF" font-family="monospace" font-size="11" text-anchor="middle">1-Click Download</text>
</svg>
