<svg width="1024" height="1024" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="promptless-grad" x1="10%" y1="10%" x2="90%" y2="90%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#06b6d4" />
      <stop offset="50%" stopColor="#8b5cf6" />
      <stop offset="100%" stopColor="#ec4899" />
    </linearGradient>
    <filter id="promptless-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded App Icon Shield -->
  <rect width="100" height="100" rx="22" fill="#09090b" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="url(#promptless-grad)" stroke-opacity="0.25" stroke-width="2" />

  <!-- Outer Hexagonal Context Prism Ring -->
  <path d="M50 15 L82 33 V67 L50 85 L18 67 V33 Z" stroke="url(#promptless-grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Inner Contextual Refraction Node (Infinity Spark Flow) -->
  <path d="M35 42 C35 34, 65 34, 65 42 C65 54, 35 50, 35 62 C35 70, 65 70, 65 62" stroke="url(#promptless-grad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#promptless-glow)" />

  <!-- Central Intelligence Node Core -->
  <circle cx="50" cy="50" r="5.5" fill="url(#promptless-grad)" />
</svg>
